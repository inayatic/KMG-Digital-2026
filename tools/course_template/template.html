<header class="top">
  <div class="brand"><b>Курс с доказательствами</b> <span class="meta"><!--BOOK--></span></div>
  <nav aria-label="Разделы курса" class="nav">
    <a href="#/path">Путь</a><a href="#/cards">Карточки</a><a href="#/summary">Конспект</a><a href="#/map">Связи</a>

<main id="main" tabindex="-1">

  <section class="view" id="v-summary" hidden><h2 tabindex="-1">Конспект</h2><p class="meta noprint">Суть каждого шага и выводы для данных. <button id="print" type="button">Печать / PDF</button></p><!--SUMMARY--></section>
  <section class="view" id="v-map" hidden><h2 tabindex="-1">Карта связей</h2><p class="meta">Шаг опирается на тех, от кого к нему идёт стрелка. Пунктир: «пример».</p><!--MAP--></section>
  <!--PAGES-->
</main>
<aside id="ev" role="region" aria-label="Источник утверждения" aria-live="polite" hidden></aside>
